<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanskrit Samasa Data Entry Tool</title>
<style>
  :root {
    --primary: #7C2D12;
    --primary-dark: #5E200C;
    --primary-soft: #F3E3DB;
    --bg: #FAF7F2;
    --card: #FFFFFF;
    --border: #E2D8CB;
    --text: #2B2118;
    --muted: #7A6B5D;
    --success: #2F6B3A;
    --error: #A12222;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Noto Sans Devanagari", Mangal, sans-serif;
    line-height: 1.5;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 22px 16px 18px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: .3px; }
  header p { margin: 4px 0 0; font-size: .92rem; opacity: .85; }

  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  /* Main tabs */
  .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .main-tab {
    flex: 1;
    padding: 16px 12px;
    font-size: 1.15rem;
    font-weight: 600;
    border: 2px solid var(--primary);
    background: #fff;
    color: var(--primary);
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .main-tab:hover { background: var(--primary-soft); }
  .main-tab.active { background: var(--primary); color: #fff; }

  .section { display: none; }
  .section.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(60, 30, 10, .06);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 1.1rem;
    color: var(--primary);
    border-bottom: 2px solid var(--primary-soft);
    padding-bottom: 8px;
  }

  /* Category radios */
  .radio-group { display: flex; flex-wrap: wrap; gap: 10px; }
  .radio-group label {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: #fff;
    font-weight: 500;
  }
  .radio-group label:has(input:checked) {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-dark);
  }
  .radio-group input { accent-color: var(--primary); }

  /* Forms */
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .field.full { grid-column: 1 / -1; }
  .field label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; color: var(--primary-dark); }
  .field input, .field textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font: inherit;
    background: #FFFEFC;
    color: var(--text);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(124, 45, 18, .15);
  }

  .example-box {
    border: 1.5px dashed #C9B8A5;
    background: #FDFBF7;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    position: relative;
  }
  .example-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .example-title { font-weight: 700; color: var(--primary); font-size: .95rem; }

  button.btn {
    font: inherit; font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 2px solid var(--primary);
    cursor: pointer;
    transition: background .15s, color .15s, opacity .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary); }
  .btn-outline:hover { background: var(--primary-soft); }
  .btn-remove {
    background: transparent; color: var(--error);
    border: 1.5px solid var(--error);
    padding: 4px 10px; font-size: .8rem; border-radius: 6px;
  }
  .btn-remove:hover { background: #FBEAEA; }
  button:disabled { opacity: .6; cursor: not-allowed; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  .status { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: .92rem; display: none; }
  .status.show { display: block; }
  .status.success { background: #E7F3E9; color: var(--success); border: 1px solid #BFDDC4; }
  .status.error { background: #FBEAEA; color: var(--error); border: 1px solid #EBC3C3; }
  .status.info { background: var(--primary-soft); color: var(--primary-dark); border: 1px solid #E5C9BB; }

  /* Sub tabs */
  .sub-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .sub-tab {
    padding: 9px 18px;
    border: 1.5px solid var(--primary);
    background: #fff; color: var(--primary);
    border-radius: 999px;
    font: inherit; font-weight: 600;
    cursor: pointer;
  }
  .sub-tab:hover { background: var(--primary-soft); }
  .sub-tab.active { background: var(--primary); color: #fff; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: var(--primary); color: #fff; position: sticky; top: 0; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #FBF7F1; }
  tbody tr:hover { background: var(--primary-soft); }

  .loading { display: flex; align-items: center; gap: 12px; padding: 24px; color: var(--muted); }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid var(--primary-soft);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { padding: 24px; color: var(--muted); text-align: center; }

  @media (max-width: 560px) {
    .main-tab { font-size: 1rem; padding: 12px 6px; }
    header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Sanskrit Samasa Data Entry Tool</h1>
  <p>समास · Compound Rule &amp; Example Repository</p>
</header>

<div class="container">

  <!-- Main navigation -->
  <div class="main-tabs" role="tablist">
    <button class="main-tab active" id="tab-entry" role="tab" data-target="section-entry">Data Entry</button>
    <button class="main-tab" id="tab-view" role="tab" data-target="section-view">View Data</button>
  </div>

  <!-- DATA ENTRY -->
  <section class="section active" id="section-entry">

    <div class="card">
      <h2>Category</h2>
      <div class="radio-group" id="categoryRadios"></div>
    </div>

    <div class="card">
      <h2>Sutra Details</h2>
      <div class="field-grid" id="parentForm"></div>
    </div>

    <div class="card">
      <h2>Examples</h2>
      <div id="examplesContainer"></div>
      <button type="button" class="btn btn-outline" id="addExampleBtn">+ Add Another Example</button>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="saveBtn">Save Data</button>
      <button type="button" class="btn btn-outline" id="clearBtn">Clear Form</button>
    </div>
    <div class="status" id="saveStatus" role="status"></div>
  </section>

  <!-- VIEW DATA -->
  <section class="section" id="section-view">
    <div class="sub-tabs" id="subTabs"></div>
    <div id="viewOutput"><div class="empty">Select a category above to load its data.</div></div>
  </section>

</div>

<script>
(function () {
  "use strict";

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm-_jBZOPdlAAPZGOPRyV_2cmk3kz7EJdrZqVYhu8znVKFXiS7pSnXxeO3hz6wW4io/exec";

  /* ---------- Category configuration ---------- */
  const CATEGORIES = {
    "Samasa Vidhayaka": {
      parent: [
        { label: "Rule ID" },
        { label: "Sutra" },
        { label: "Samasa Type" },
        { label: "Sanskrit Description", type: "textarea", full: true },
        { label: "English Description", type: "textarea", full: true }
      ],
      child: [
        { label: "Samastapada" },
        { label: "Purvapada" },
        { label: "Uttarapada" },
        { label: "Pratipadika" },
        { label: "Vishesha" }
      ]
    },
    "Samasanta Pratyaya": {
      parent: [
        { label: "Rule ID" },
        { label: "Sutra" },
        { label: "Suffix (Pratyaya)" },
        { label: "Purvapada/Samasa Condition" },
        { label: "Uttarapada Root Ending" }
      ],
      child: [
        { label: "Original Pratipadika" },
        { label: "Changed Pratipadika Form" },
        { label: "Samastapada (Example)" },
        { label: "Vishesha" }
      ]
    },
    "Aluk Samasa": {
      parent: [
        { label: "Rule ID" },
        { label: "Sutra" },
        { label: "Samasa Name" },
        { label: "Retained Vibhakti" },
        { label: "Uttarapada Condition (Nimitta)" },
        { label: "Special Task (Vishesha Karya)" }
      ],
      child: [
        { label: "Aluk Example (Samastapada)" },
        { label: "Vishesha" }
      ]
    }
  };
  const CATEGORY_NAMES = Object.keys(CATEGORIES);
  const DEFAULT_CATEGORY = CATEGORY_NAMES[0];

  /* ---------- Element refs ---------- */
  const $ = (id) => document.getElementById(id);
  const categoryRadios = $("categoryRadios");
  const parentForm = $("parentForm");
  const examplesContainer = $("examplesContainer");
  const addExampleBtn = $("addExampleBtn");
  const saveBtn = $("saveBtn");
  const clearBtn = $("clearBtn");
  const saveStatus = $("saveStatus");
  const subTabs = $("subTabs");
  const viewOutput = $("viewOutput");

  let currentCategory = DEFAULT_CATEGORY;
  let exampleCounter = 0;
  let viewRequestId = 0;

  /* ---------- Helpers ---------- */
  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach((k) => {
        if (k === "class") node.className = props[k];
        else if (k === "text") node.textContent = props[k];
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach((c) => node.appendChild(c));
    return node;
  }

  function buildField(def, id) {
    const wrap = el("div", { class: "field" + (def.full ? " full" : "") });
    wrap.appendChild(el("label", { for: id, text: def.label }));
    const input = def.type === "textarea"
      ? el("textarea", { id: id, rows: "3" })
      : el("input", { id: id, type: "text", autocomplete: "off" });
    wrap.appendChild(input);
    return wrap;
  }

  function showStatus(msg, kind) {
    saveStatus.textContent = msg;
    saveStatus.className = "status show " + kind;
  }
  function hideStatus() { saveStatus.className = "status"; saveStatus.textContent = ""; }

  /* ---------- Main tab switching ---------- */
  document.querySelectorAll(".main-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".main-tab").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".section").forEach((s) => s.classList.remove("active"));
      btn.classList.add("active");
      $(btn.dataset.target).classList.add("active");
    });
  });

  /* ---------- Category radios ---------- */
  CATEGORY_NAMES.forEach((name, i) => {
    const input = el("input", { type: "radio", name: "category", value: name });
    if (i === 0) input.checked = true;
    input.addEventListener("change", () => {
      if (input.checked) setCategory(name);
    });
    categoryRadios.appendChild(el("label", null, [input, el("span", { text: name })]));
  });

  /* ---------- Parent form ---------- */
  function renderParentForm() {
    parentForm.innerHTML = "";
    CATEGORIES[currentCategory].parent.forEach((def, i) => {
      parentForm.appendChild(buildField(def, "parent-" + i));
    });
  }

  /* ---------- Examples ---------- */
  function addExample() {
    exampleCounter++;
    const box = el("div", { class: "example-box" });
    box.dataset.uid = exampleCounter;

    const title = el("span", { class: "example-title" });
    const removeBtn = el("button", { type: "button", class: "btn-remove", text: "Remove" });
    removeBtn.addEventListener("click", () => {
      box.remove();
      if (!examplesContainer.children.length) addExample();
      renumberExamples();
    });
    box.appendChild(el("div", { class: "example-head" }, [title, removeBtn]));

    const grid = el("div", { class: "field-grid" });
    CATEGORIES[currentCategory].child.forEach((def, i) => {
      grid.appendChild(buildField(def, "ex-" + exampleCounter + "-" + i));
    });
    box.appendChild(grid);

    examplesContainer.appendChild(box);
    renumberExamples();
  }

  function renumberExamples() {
    Array.from(examplesContainer.children).forEach((box, i) => {
      box.querySelector(".example-title").textContent = "Example " + (i + 1);
    });
  }

  function resetExamples() {
    examplesContainer.innerHTML = "";
    addExample();
  }

  function setCategory(name) {
    currentCategory = name;
    renderParentForm();
    resetExamples();
    hideStatus();
  }

  addExampleBtn.addEventListener("click", addExample);

  clearBtn.addEventListener("click", () => {
    renderParentForm();
    resetExamples();
    hideStatus();
  });

  /* ---------- Save (POST) ---------- */
  function collectRows() {
    const parentVals = Array.from(parentForm.querySelectorAll("input, textarea"))
      .map((f) => f.value.trim());
    const rows = [];
    Array.from(examplesContainer.children).forEach((box) => {
      const childVals = Array.from(box.querySelectorAll("input, textarea"))
        .map((f) => f.value.trim());
      if (childVals.some((v) => v !== "")) {
        rows.push(parentVals.concat(childVals));
      }
    });
    return { parentVals, rows };
  }

  saveBtn.addEventListener("click", async () => {
    const { parentVals, rows } = collectRows();

    if (!parentVals[0]) {
      showStatus("Please enter a Rule ID before saving.", "error");
      parentForm.querySelector("input, textarea").focus();
      return;
    }
    if (!rows.length) {
      showStatus("Please fill in at least one example before saving.", "error");
      return;
    }

    const payload = { category: currentCategory, rows: rows };
    saveBtn.disabled = true;
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = "Saving…";
    showStatus("Sending " + rows.length + " row(s)…", "info");

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      // no-cors gives an opaque response, so success cannot be verified directly.
      showStatus("Saved " + rows.length + " row(s) to \"" + currentCategory + "\". Check View Data to confirm.", "success");
      renderParentForm();
      resetExamples();
    } catch (err) {
      showStatus("Could not send data: " + err.message, "error");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = originalLabel;
    }
  });

  /* ---------- View Data (GET) ---------- */
  CATEGORY_NAMES.forEach((name) => {
    const b = el("button", { type: "button", class: "sub-tab", text: name });
    b.addEventListener("click", () => {
      subTabs.querySelectorAll(".sub-tab").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      loadView(name);
    });
    subTabs.appendChild(b);
  });

  function normalizeData(json) {
    if (Array.isArray(json)) return json;
    if (json && Array.isArray(json.data)) return json.data;
    if (json && Array.isArray(json.rows)) return json.rows;
    return null;
  }

  async function loadView(categoryName) {
    const reqId = ++viewRequestId;
    viewOutput.innerHTML = "";
    viewOutput.appendChild(
      el("div", { class: "loading" }, [el("div", { class: "spinner" }), el("span", { text: "Loading " + categoryName + "…" })])
    );

    try {
      const res = await fetch(SCRIPT_URL + "?category=" + encodeURIComponent(categoryName), {
        method: "GET",
        redirect: "follow"
      });
      if (!res.ok) throw new Error("Server responded with status " + res.status);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (e) { throw new Error("Response was not valid JSON."); }

      if (reqId !== viewRequestId) return; // a newer request superseded this one

      const data = normalizeData(json);
      if (!data) {
        const msg = json && json.error ? json.error : "Unexpected response format.";
        throw new Error(msg);
      }
      renderTable(data);
    } catch (err) {
      if (reqId !== viewRequestId) return;
      viewOutput.innerHTML = "";
      const box = el("div", { class: "status show error", text: "Failed to load data: " + err.message });
      viewOutput.appendChild(box);
    }
  }

  function renderTable(data) {
    viewOutput.innerHTML = "";
    if (!data.length) {
      viewOutput.appendChild(el("div", { class: "empty", text: "No data found for this category." }));
      return;
    }

    const headers = Array.isArray(data[0]) ? data[0] : [data[0]];
    const body = data.slice(1);

    const thead = el("thead");
    const headRow = el("tr");
    headers.forEach((h) => headRow.appendChild(el("th", { text: String(h) })));
    thead.appendChild(headRow);

    const tbody = el("tbody");
    body.forEach((row) => {
      const tr = el("tr");
      const cells = Array.isArray(row) ? row : [row];
      for (let i = 0; i < headers.length; i++) {
        const v = cells[i];
        tr.appendChild(el("td", { text: v === null || v === undefined ? "" : String(v) }));
      }
      tbody.appendChild(tr);
    });

    const table = el("table", null, [thead, tbody]);
    viewOutput.appendChild(el("div", { class: "table-wrap" }, [table]));
    if (!body.length) {
      viewOutput.appendChild(el("div", { class: "empty", text: "No records yet — only headers found." }));
    }
  }

  /* ---------- Init ---------- */
  setCategory(DEFAULT_CATEGORY);
})();
</script>
</body>
</html>
